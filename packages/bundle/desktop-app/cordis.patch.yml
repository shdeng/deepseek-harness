# Desktop-only Host rows applied after dsh-gui-app. The Tauri shell carries
# application assets, client bundles, RPC requests, and downlink streams.

- insert:
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-desktop'

    - id: ui-directory-picker
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

- id: credentials
  disabled: true

- insert:
    - id: credentials-system
      name: '@deepseek-ai/dsh-credentials-system'

    - id: games
      name: '@deepseek-ai/dsh-game'

    - id: game-2048
      name: '@deepseek-ai/dsh-game-2048'

    - id: companion
      name: '@deepseek-ai/dsh-game-companion'
      config:
        mode: off
